<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Depoimentos</title>
<script src="./config.js?v=2"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supa = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

async function check(){
  const { data:{session} } = await supa.auth.getSession()
  if(!session){ document.getElementById('login').style.display='block'; return }
  document.getElementById('app').style.display='block'
  load()
}
async function login(e){
  e.preventDefault()
  const email = login.email.value, password = login.senha.value
  const { error } = await supa.auth.signInWithPassword({email,password})
  if(error) return alert(error.message)
  location.reload()
}
async function load(){
  const { data } = await supa.from('testimonials').select('*').order('created_at',{ascending:false})
  app.innerHTML = `<h2>Depoimentos (${data.length})</h2>` + data.map(d=>`
    <div style="border:1px solid #333;padding:10px;margin:8px 0;border-radius:8px">
      <b>${d.name}</b> - ${d.rating}★<br>${d.text}<br>
      <small>${d.approved?'✅ aprovado':'⏳ pendente'}</small>
      <button onclick="toggle('${d.id}',${!d.approved})">${d.approved?'Desaprovar':'Aprovar'}</button>
    </div>`).join('')
}
window.toggle = async(id,val)=>{ await supa.from('testimonials').update({approved:val}).eq('id',id); load() }
window.onload = check
window.login = login
</script>
<style>body{background:#0b0b0b;color:#eee;font-family:system-ui;padding:20px}input,button{padding:10px;margin:4px;border-radius:6px;border:1px solid #333;background:#111;color:#eee}button{background:#22c55e;color:#000;font-weight:600}</style>
</head><body>
<div id="login" style="display:none;max-width:320px;margin:auto">
  <h1>Login Admin</h1>
  <form onsubmit="login(event)"><input name="email" type="email" placeholder="email" required><br>
  <input name="senha" type="password" placeholder="senha" required><br>
  <button>Entrar</button></form>
</div>
<div id="app" style="display:none"></div>
</body></html>
