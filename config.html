<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Depoimentos</title>
<script src="./config.js?v=3"></script>
<style>
body{margin:0;background:#0a0a0a;color:#e5e5e5;font-family:system-ui;padding:20px}
.card{max-width:720px;margin:auto;background:#111;border:1px solid #222;border-radius:12px;padding:20px}
input,button,select{padding:10px;border-radius:8px;border:1px solid #333;background:#000;color:#eee;font-size:15px}
button{background:#22c55e;color:#000;font-weight:600;cursor:pointer}
button.sec{background:#222;color:#eee}
.item{border:1px solid #222;padding:12px;margin:10px 0;border-radius:8px}
.badge{font-size:12px;padding:2px 6px;border-radius:4px;background:#333}
.ok{background:#14532d;color:#86efac}
</style>
</head>
<body>
<div class="card">
  <div id="loginBox">
    <h2>Login Admin</h2>
    <input id="email" type="email" placeholder="manchtec@gmail.com" style="width:100%;margin-bottom:8px">
    <input id="senha" type="password" placeholder="senha" style="width:100%;margin-bottom:12px">
    <button id="btnLogin">Entrar</button>
    <p id="msg" style="color:#f88"></p>
  </div>

  <div id="appBox" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>Depoimentos</h2>
      <button id="btnLogout" class="sec">Sair</button>
    </div>
    <div id="lista">Carregando...</div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

if (typeof SUPABASE_URL === 'undefined') {
  document.getElementById('msg').textContent = 'config.js não carregado'
}

const supa = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

const $ = id => document.getElementById(id)
const loginBox = $('loginBox'), appBox = $('appBox'), lista = $('lista'), msg = $('msg')

async function checkSession(){
  const { data:{session} } = await supa.auth.getSession()
  if(session){ loginBox.style.display='none'; appBox.style.display='block'; carregar() }
}

$('btnLogin').onclick = async ()=>{
  msg.textContent = ''
  const { error } = await supa.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('senha').value
  })
  if(error){ msg.textContent = error.message; return }
  checkSession()
}

$('btnLogout').onclick = async ()=>{ await supa.auth.signOut(); location.reload() }

async function carregar(){
  lista.textContent = 'Carregando...'
  const { data, error } = await supa.from('testimonials').select('*').order('created_at',{ascending:false})
  if(error){ lista.textContent = error.message; return }
  lista.innerHTML = data.map(d=>`
    <div class="item">
      <div><strong>${d.name||'Anônimo'}</strong> — ${d.rating||5}★ 
      <span class="badge ${d.approved?'ok':''}">${d.approved?'aprovado':'pendente'}</span></div>
      <div style="margin:6px 0">${d.text||''}</div>
      <button onclick="aprovar('${d.id}',${!d.approved})">${d.approved?'Desaprovar':'Aprovar'}</button>
    </div>`).join('') || '<p>Nenhum depoimento</p>'
}

window.aprovar = async (id, val)=>{
  await supa.from('testimonials').update({approved:val}).eq('id',id)
  carregar()
}

checkSession()
</script>
</body>
</html>
