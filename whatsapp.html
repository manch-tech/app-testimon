<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerador WhatsApp</title><style>body{font-family:Inter;background:linear-gradient(135deg,#1a3a5f,#0f243b);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}.box{background:#fff;color:#0f243b;padding:30px;border-radius:20px;max-width:420px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,.3);text-align:center}.logo{width:80px;height:80px;background:#c59d5f;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-weight:800;color:#1a3a5f;font-size:24px}input,textarea{width:100%;padding:12px;margin:8px 0;border:2px solid #e2e8f0;border-radius:10px;font-size:16px;box-sizing:border-box}button{width:100%;padding:14px;background:#25D366;color:#fff;border:none;border-radius:10px;font-weight:700;margin-top:10px;cursor:pointer;font-size:16px}a{display:block;text-align:center;margin-top:14px;color:#1a3a5f;font-weight:600;text-decoration:none;padding:12px;background:#e2fbe9;border-radius:10px}</style></head><body>
<div class="box">
<div class="logo">MP</div>
<h2 style="margin:0">Manoel Pedra</h2>
<p style="color:#64748b;margin:4px 0 20px">(47) 99206-9588</p>
<input id="nome" placeholder="Nome do cliente">
<input id="fone" placeholder="WhatsApp do cliente">
<textarea id="msg" rows="6">Manoel Pedra
(47) 99206-9588

Agora você pode fazer sua avaliação sobre Manoel Pedra
Ajude a melhorar nossos serviços!

https://manch-tech.github.io/app-testimon/</textarea>
<button onclick="gerar()">Gerar link</button>
<a id="link" target="_blank" style="display:none"></a>
</div>
<script>
function gerar(){
 const fone=document.getElementById('fone').value.replace(/\D/g,'');
 const msg=document.getElementById('msg').value;
 const url=`https://wa.me/55${fone}?text=${encodeURIComponent(msg)}`;
 const a=document.getElementById('link'); a.href=url; a.textContent='📱 Abrir no WhatsApp'; a.style.display='block';
}
</script></body></html>
