<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depoimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- Prévia para WhatsApp e redes sociais -->
<meta property="og:title" content="Manoel Pedra - Deixe seu Depoimento">
<meta property="og:description" content="Construção e Reforma em Gaspar/SC - (47) 99206-9588. Ajude a melhorar nossos serviços!">
<meta property="og:image" content="https://manch-tech.github.io/app-testimon/logo.png">
<meta property="og:url" content="https://manch-tech.github.io/app-testimon/">
<meta name="twitter:card" content="summary_large_image">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui;background:linear-gradient(135deg,#1a3a5f 0%,#0f243b 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;width:100%;max-width:500px;border-radius:24px;padding:36px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.logo{text-align:center;margin-bottom:20px;font-size:28px;font-weight:700;color:#1a3a5f}
.logo span{color:#c59d5f}
h1{margin:0 0 6px;font-size:24px;color:#1a3a5f;text-align:center}
.sub{color:#64748b;text-align:center;margin-bottom:28px;font-size:15px}
label{display:block;margin:16px 0 6px;font-weight:600;color:#334155;font-size:14px}
input,textarea,select{width:100%;padding:14px 16px;border:2px solid #e2e8f0;border-radius:12px;font-size:16px;font-family:inherit;transition:.2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:#1a3a5f;box-shadow:0 0 0 3px rgba(26,58,95,.1)}
textarea{resize:vertical;min-height:110px}
button{margin-top:24px;width:100%;padding:16px;background:linear-gradient(135deg,#1a3a5f,#0f243b);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:.2s}
button:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(26,58,95,.3)}
button:disabled{opacity:.6;transform:none}
.msg{margin-top:16px;padding:14px;border-radius:10px;font-size:14px;display:none;text-align:center}
.ok{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.err{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.stars{display:flex;gap:4px;justify-content:center;margin:8px 0}
</style>

<link rel="manifest" href="/app-testimon/manifest.json">
<meta name="theme-color" content="#0d6efd">
<link rel="apple-touch-icon" href="/app-testimon/icon-192.png">

</head>
<body>
<div class="card">
<div class="logo">
<span></span></div>
<h1>Conte sua experiência</h1>
<p class="sub">Seu depoimento ajuda outros clientes</p>
<form id="f">
<label>📱 Telefone cadastrado</label>
<input id="phone" placeholder="(47) 9 9999-9999" required>
<label>👤 Seu nome</label>
<input id="name" placeholder="Nome completo" required>
<label>✉️ Email</label>
<input id="email" type="email" placeholder="seu@email.com" required>
<label>💬 Depoimento</label>
<textarea id="message" placeholder="Como foi trabalhar com a gente?" required></textarea>
<label>⭐ Sua nota</label>
<select id="rating"><option value="5">★★★★★ Excelente</option><option value="4">★★★★ Muito bom</option><option value="3">★★★ Bom</option><option value="2">★★ Regular</option><option value="1">★ Ruim</option></select>
<button id="btn" type="submit">Enviar depoimento</button>
<div id="ok" class="msg ok">✓ Obrigado! Recebemos seu depoimento, será validado e publicado em breve.</div>
<div id="err" class="msg err"></div>
</form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supa = window.supabase.createClient('https://lovwxccrxxahdxtychxy.supabase.co','sb_publishable_HJ3-sMYvcOXXWJTtkz-7Rg_alxdTn6L');
const f=document.getElementById('f'),btn=document.getElementById('btn'),ok=document.getElementById('ok'),err=document.getElementById('err');
f.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;ok.style.display='none';err.style.display='none';const phone=document.getElementById('phone').value.replace(/\D/g,'');const name=document.getElementById('name').value.trim();const email=document.getElementById('email').value.trim();const message=document.getElementById('message').value.trim();const rating=parseInt(document.getElementById('rating').value);const {data:c}=await supa.from('clients').select('phone').eq('phone',phone).maybeSingle();if(!c){await supa.from('clients').insert([{phone,name,email}])}const {error}=await supa.from('testimonials').insert([{name,email,phone,message,rating,approved:false}]);if(error){err.textContent=error.message;err.style.display='block'}else{ok.style.display='block';f.reset()}btn.disabled=false});
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
navigator.serviceWorker.register('/app-testimon/sw.js', { scope: '/app-testimon/' });
  });
}
</script>

</body></html>
