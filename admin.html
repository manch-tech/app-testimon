<!DOCTYPE html>
<html lang="pt-BR">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Depoimentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#fbf7f1;
  --paper:#ffffff;
  --ink:#1f1a17;
  --muted:#786c63;
  --line:#eadfce;
  --accent:#a07a48;
  --accent-2:#8c6a3e;
  --green:#2f7a5b;
  --red:#b43c3c;
  --shadow:0 12px 30px rgba(31,26,23,.08);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Work Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{
  font-family:"Fraunces", Georgia, serif;
  font-weight:700;
  letter-spacing:.2px;
  margin:0 0 .5rem;
}
.container{max-width:1000px;margin:0 auto;padding:24px}

/* Header */
header{
  position:sticky;top:0;z-index:10;
  backdrop-filter:saturate(1.2) blur(8px);
  background:color-mix(in srgb, var(--bg) 80%, white 20%);
  border-bottom:1px solid var(--line);
}
.header-inner{
  max-width:1000px;margin:0 auto;padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.brand{display:flex;align-items:center;gap:12px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.brand h1{font-size:1.25rem}

/* Login */
#login-view{min-height:100dvh;display:grid;place-items:center;padding:24px}
.login-card{
  width:100%;max-width:400px;background:var(--paper);
  border:1px solid var(--line);border-radius:20px;padding:28px;
  box-shadow:var(--shadow);
}
.login-card h2{font-size:1.6rem;margin-bottom:16px}
label{display:block;font-size:.9rem;color:var(--muted);margin:14px 0 6px}
input,textarea{
  width:100%;padding:12px 14px;border:1px solid var(--line);
  border-radius:12px;background:#fffefb;font:inherit;color:inherit;
  outline:none;transition:border .15s, box-shadow .15s;
}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(160,122,72,.15)}
.password-field{position:relative}
.password-field input{padding-right:46px}
.toggle-pass{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;display:grid;place-items:center;
  background:transparent;border:none;cursor:pointer;border-radius:10px;
  font-size:18px;line-height:1;color:var(--muted);
}
.toggle-pass:hover{background:#f5ede2;color:var(--ink)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 16px;border-radius:12px;border:1px solid transparent;
  font-weight:600;cursor:pointer;transition:transform .05s ease,opacity .2s;
  font-family:"Work Sans",sans-serif;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--ink);color:white;width:100%;margin-top:16px}
.btn-primary:hover{opacity:.92}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:#fff7ec}
.btn-approve{background:var(--green);color:#fff}
.btn-edit{background:var(--accent);color:#fff}
.btn-edit:hover{background:var(--accent-2)}
.btn-delete{background:var(--red);color:#fff}
.btn-small{padding:8px 12px;font-size:.9rem;border-radius:10px}
.helper{color:var(--muted);font-size:.9rem;margin-top:10px;min-height:1.2em}

/* App */
#app-view{display:none}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}
.tab{
  padding:9px 14px;border-radius:999px;border:1px solid var(--line);
  background:#fff;cursor:pointer;font-weight:600;color:var(--muted)
}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab span{margin-left:6px;font-weight:500;opacity:.8}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 16px}
.muted{color:var(--muted);font-size:.95rem}

.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}

.card{
  background:var(--paper);border:1px solid var(--line);border-radius:18px;
  padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px
}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.avatar{
  width:36px;height:36px;border-radius:50%;background:#f0e6d7;
  display:grid;place-items:center;font-family:"Fraunces",serif;font-weight:700;color:var(--accent)
}
.name{font-weight:600}
.role{color:var(--muted);font-size:.9rem}
.message{
  font-size:1.02rem;line-height:1.6;background:#fffbf3;
  border:1px dashed var(--line);padding:12px;border-radius:12px;white-space:pre-wrap
}
.date{color:var(--muted);font-size:.85rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.empty{
  text-align:center;color:var(--muted);padding:40px;
  border:1px dashed var(--line);border-radius:16px;background:#fffdf8
}

/* Modal */
.modal{
  position:fixed;inset:0;background:rgba(28,20,14,.45);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:50
}
.modal.open{display:flex}
.modal-dialog{
  width:100%;max-width:560px;background:var(--paper);
  border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  padding:22px;
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.modal-head h3{font-size:1.3rem}
.modal-body{display:grid;gap:12px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
textarea{min-height:120px;resize:vertical}

/* Utilities */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.hidden{display:none !important}
@media (max-width:390px){
  .container,.header-inner{padding:16px}
  .card{padding:16px}
  .actions .btn{flex:1 1 auto}
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <h1>Painel de Depoimentos</h1>
    </div>
    <button id="logoutBtn" class="btn btn-ghost btn-small hidden">Sair</button>
  </div>
</header>

<!-- LOGIN -->
<div id="login-view">
  <div class="login-card">
    <h2>Entrar</h2>
    <form id="login-form" autocomplete="on">
      <label for="email">E-mail</label>
      <input id="email" type="email" inputmode="email" placeholder="voce@exemplo.com" required>

      <label for="password">Senha</label>
      <div class="password-field">
        <input id="password" type="password" placeholder="••••••••" required>
        <button type="button" class="toggle-pass" id="togglePassword" aria-label="Mostrar senha" title="Mostrar/ocultar">👁</button>
      </div>

      <button class="btn btn-primary" type="submit">Acessar</button>
      <p id="login-error" class="helper" role="alert"></p>
    </form>
  </div>
</div>

<!-- APP -->
<main id="app-view" class="container">
  <div class="toolbar">
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="pending" role="tab" aria-selected="true">Pendentes <span id="count-pending">0</span></button>
      <button class="tab" data-tab="approved" role="tab" aria-selected="false">Aprovados <span id="count-approved">0</span></button>
    </div>
    <div class="muted" id="last-refresh">—</div>
  </div>

  <section id="panel-pending" class="grid" aria-live="polite"></section>
  <section id="panel-approved" class="grid hidden" aria-live="polite"></section>
</main>

<!-- EDIT MODAL -->
<div id="edit-modal" class="modal" aria-hidden="true">
  <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="edit-title">
    <div class="modal-head">
      <h3 id="edit-title">Editar depoimento</h3>
      <button class="btn btn-ghost btn-small" id="edit-close">Fechar</button>
    </div>
    <div class="modal-body">
      <div>
        <label for="edit-name">Nome</label>
        <input id="edit-name" type="text" maxlength="80">
      </div>
      <div>
        <label for="edit-role">Cargo / Empresa</label>
        <input id="edit-role" type="text" maxlength="120" placeholder="Ex: CEO na Acme">
      </div>
      <div>
        <label for="edit-message">Mensagem</label>
        <textarea id="edit-message" maxlength="1000"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="edit-cancel">Cancelar</button>
      <button class="btn btn-edit" id="edit-save">Salvar alterações</button>
    </div>
  </div>
</div>

<script>
/* === Supabase config inline === */
const SUPABASE_URL = "https://lovwxccrxxahdxtychxy.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxvdnd4Y2NyeHhhaGR4dHljaHh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMDExNjgsImV4cCI6MjA5ODY3NzE2OH0.eH5q9jxnJQYfuE1g8IvJeGT0aRz2vOFSDY8zcr-ANDc";
const { createClient } = window.supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* === Elements === */
const loginView = document.getElementById('login-view');
const appView = document.getElementById('app-view');
const loginForm = document.getElementById('login-form');
const loginError = document.getElementById('login-error');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const togglePassword = document.getElementById('togglePassword');
const logoutBtn = document.getElementById('logoutBtn');

const panelPending = document.getElementById('panel-pending');
const panelApproved = document.getElementById('panel-approved');
const countPending = document.getElementById('count-pending');
const countApproved = document.getElementById('count-approved');
const lastRefresh = document.getElementById('last-refresh');

const editModal = document.getElementById('edit-modal');
const editName = document.getElementById('edit-name');
const editRole = document.getElementById('edit-role');
const editMessage = document.getElementById('edit-message');
const editSave = document.getElementById('edit-save');
const editCancel = document.getElementById('edit-cancel');
const editClose = document.getElementById('edit-close');

let pendingItems = [];
let approvedItems = [];
let currentEditId = null;
let currentTab = 'pending';

/* === Password toggle === */
togglePassword.addEventListener('click', () => {
  const isPass = passwordInput.type === 'password';
  passwordInput.type = isPass ? 'text' : 'password';
  togglePassword.textContent = isPass ? '🙈' : '👁';
  togglePassword.setAttribute('aria-label', isPass ? 'Ocultar senha' : 'Mostrar senha');
});

/* === Auth === */
async function checkSession(){
  const { data: { session } } = await supabase.auth.getSession();
  if(session){ showApp(); } else { showLogin(); }
}
function showLogin(){
  loginView.style.display = 'grid';
  appView.style.display = 'none';
  logoutBtn.classList.add('hidden');
}
function showApp(){
  loginView.style.display = 'none';
  appView.style.display = 'block';
  logoutBtn.classList.remove('hidden');
  loadAll();
}
loginForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  loginError.textContent = '';
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if(error){ loginError.textContent = 'Credenciais inválidas.'; return; }
  showApp();
});
logoutBtn.addEventListener('click', async ()=>{
  await supabase.auth.signOut();
  showLogin();
});

/* === Tabs === */
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    panelPending.classList.toggle('hidden', currentTab !== 'pending');
    panelApproved.classList.toggle('hidden', currentTab !== 'approved');
  });
});

/* === Load data === */
async function loadAll(){
  await Promise.all([loadPending(), loadApproved()]);
  lastRefresh.textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
async function loadPending(){
  const { data, error } = await supabase
    .from('testimonials')
    .select('*')
    .eq('status','pending')
    .order('created_at',{ascending:false});
  if(error){ panelPending.innerHTML = `<div class="empty">Erro ao carregar.</div>`; return; }
  pendingItems = data || [];
  countPending.textContent = pendingItems.length;
  renderPending();
}
async function loadApproved(){
  const { data, error } = await supabase
    .from('testimonials')
    .select('*')
    .eq('status','approved')
    .order('approved_at',{ascending:false});
  if(error){ panelApproved.innerHTML = `<div class="empty">Erro ao carregar.</div>`; return; }
  approvedItems = data || [];
  countApproved.textContent = approvedItems.length;
  renderApproved();
}

/* === Render === */
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }
function initials(name){ return (name||'?').split(' ').slice(0,2).map(p=>p[0]).join('').toUpperCase(); }
function fmtDate(d){ try{ return new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) }catch{ return '' } }

function renderPending(){
  if(!pendingItems.length){
    panelPending.innerHTML = `<div class="empty">Nenhum depoimento pendente. ✨</div>`;
    return;
  }
  panelPending.innerHTML = pendingItems.map(item=>`
    <article class="card">
      <div class="meta">
        <div class="avatar" aria-hidden="true">${initials(item.name)}</div>
        <div>
          <div class="name">${escapeHtml(item.name)}</div>
          <div class="role">${escapeHtml(item.role_company||'')}</div>
        </div>
      </div>
      <div class="message">${escapeHtml(item.message)}</div>
      <div class="date">Enviado em ${fmtDate(item.created_at)}</div>
      <div class="actions">
        <button class="btn btn-small btn-approve" onclick="approveItem('${item.id}')">Aprovar</button>
        <button class="btn btn-small btn-edit" onclick="openEdit('${item.id}')">Editar</button>
        <button class="btn btn-small btn-delete" onclick="deleteItem('${item.id}')">Excluir</button>
      </div>
    </article>
  `).join('');
}
function renderApproved(){
  if(!approvedItems.length){
    panelApproved.innerHTML = `<div class="empty">Ainda não há aprovados.</div>`;
    return;
  }
  panelApproved.innerHTML = approvedItems.map(item=>`
    <article class="card">
      <div class="meta">
        <div class="avatar" aria-hidden="true">${initials(item.name)}</div>
        <div>
          <div class="name">${escapeHtml(item.name)}</div>
          <div class="role">${escapeHtml(item.role_company||'')}</div>
        </div>
      </div>
      <div class="message">${escapeHtml(item.message)}</div>
      <div class="date">Aprovado em ${fmtDate(item.approved_at || item.updated_at)}</div>
      <div class="actions">
        <button class="btn btn-small btn-ghost" onclick="unpublishItem('${item.id}')">Despublicar</button>
        <button class="btn btn-small btn-delete" onclick="deleteItem('${item.id}')">Excluir</button>
      </div>
    </article>
  `).join('');
}

/* === Actions === */
async function approveItem(id){
  const { error } = await supabase.from('testimonials').update({ status:'approved', approved_at:new Date().toISOString() }).eq('id', id);
  if(error) return alert('Erro ao aprovar');
  await loadAll();
}
async function unpublishItem(id){
  if(!confirm('Voltar para pendentes?')) return;
  const { error } = await supabase.from('testimonials').update({ status:'pending', approved_at:null }).eq('id', id);
  if(error) return alert('Erro ao despublicar');
  await loadAll();
}
async function deleteItem(id){
  if(!confirm('Excluir definitivamente?')) return;
  const { error } = await supabase.from('testimonials').delete().eq('id', id);
  if(error) return alert('Erro ao excluir');
  await loadAll();
}

/* === Edit Modal === */
function openEdit(id){
  const item = pendingItems.find(x=>x.id===id) || approvedItems.find(x=>x.id===id);
  if(!item) return;
  currentEditId = id;
  editName.value = item.name || '';
  editRole.value = item.role_company || '';
  editMessage.value = item.message || '';
  editModal.classList.add('open');
  editModal.setAttribute('aria-hidden','false');
  setTimeout(()=>editName.focus(),50);
}
function closeEdit(){
  editModal.classList.remove('open');
  editModal.setAttribute('aria-hidden','true');
  currentEditId = null;
}
editCancel.addEventListener('click', closeEdit);
editClose.addEventListener('click', closeEdit);
editModal.addEventListener('click', (e)=>{ if(e.target===editModal) closeEdit(); });

editSave.addEventListener('click', async ()=>{
  const name = editName.value.trim();
  const role_company = editRole.value.trim();
  const message = editMessage.value.trim();
  if(!name || !message){ alert('Preencha nome e mensagem.'); return; }
  const { error } = await supabase.from('testimonials').update({ name, role_company, message, updated_at:new Date().toISOString() }).eq('id', currentEditId);
  if(error){ alert('Erro ao salvar: '+error.message); return; }
  closeEdit();
  await loadAll();
});

/* === Init === */
checkSession();
window.approveItem = approveItem;
window.unpublishItem = unpublishItem;
window.deleteItem = deleteItem;
window.openEdit = openEdit;
</script>

<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;var a=target.closest?target.closest("a[href]"):null;if(!a||!a.href||!/^https?:\/\//.test(a.href))return;if(a.href.replace(/#.*$/,"")===loc)return;var productId=extractProductId(target)||extractProductId(a);if(!productId)return;e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*")},true)})();</script></body>
</html>
