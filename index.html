<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deixe seu Depoimento - Manoel Pedra</title>
<style>
body{font-family:system-ui;background:#f5f5f5;display:flex;justify-content:center;padding:20px}
.card{background:#fff;max-width:480px;width:100%;padding:28px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{margin:0 0 8px;color:#1a3a5f} p{color:#666;margin:0 0 20px}
label{display:block;margin:12px 0 4px;font-weight:600}
input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:16px}
button{margin-top:18px;width:100%;padding:14px;background:#1a3a5f;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer}
button:disabled{opacity:.6}
.msg{margin-top:12px;padding:10px;border-radius:6px;display:none}
.ok{background:#e6f7ee;color:#0a5} .err{background:#fde8e8;color:#c00}
</style>
</head>
<body>
<div class="card">
<h1>Seu depoimento</h1>
<p>Só clientes cadastrados podem enviar.</p>
<form id="f">
<label>Telefone cadastrado</label>
<input id="phone" placeholder="(47) 99999-9999" required>

<label>Seu nome</label>
<input id="name" placeholder="Manoel Pedra" required>

<label>Seu email</label>
<input id="email" type="email" placeholder="voce@email.com" required>

<label>Depoimento</label>
<textarea id="message" rows="4" required></textarea>

<label>Nota</label>
<select id="rating"><option>5 - Excelente</option><option>4</option><option>3</option><option>2</option><option>1</option></select>

<button id="btn">Enviar</button>
<div id="ok" class="msg ok">Obrigado! Enviado para aprovação.</div>
<div id="err" class="msg err"></div>
</form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supa = window.supabase.createClient(
  'https://lovwxccrxxahdxtychxy.supabase.co',
  'SUA_ANON_KEY_AQUI'
);
const f=document.getElementById('f'), btn=document.getElementById('btn');
f.addEventListener('submit', async e=>{
  e.preventDefault(); btn.disabled=true;
  const phone=document.getElementById('phone').value.replace(/\D/g,'');
  const name=document.getElementById('name').value.trim();
  const email=document.getElementById('email').value.trim();
  const message=document.getElementById('message').value.trim();
  const rating=parseInt(document.getElementById('rating').value);

  const {data:c}=await supa.from('clients').select('phone').eq('phone',phone).maybeSingle();
  if(!c){showErr('Telefone não encontrado');btn.disabled=false;return}

  const {error}=await supa.from('testimonials').insert([{name,email,phone,message,rating,approved:false}]);
  if(error){showErr(error.message)} else {document.getElementById('ok').style.display='block';f.reset()}
  btn.disabled=false;
});
function showErr(m){const e=document.getElementById('err');e.textContent=m;e.style.display='block'}
</script>
</body></html>
