name: Manter Supabase Vivo

on:
  schedule:
    - cron: '0 12 * * *'  # todo dia 09:00 no Brasil (12:00 UTC)
  workflow_dispatch:  # permite testar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar Supabase Manoel Pedra
        run: |
          curl -s "https://lovwxccrxxahdxtychxy.supabase.co/rest/v1/testimonials?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -o /dev/null
          echo "Supabase pingado com sucesso - nao vai pausar mais"