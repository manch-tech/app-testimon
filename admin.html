<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste Login Supabase</title>
<style>
body{margin:0;font-family:system-ui;background:#020617;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{width:100%;max-width:420px;background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:24px}
h1{font-size:18px;margin:0 0 4px}
p{margin:0 0 16px;color:#94a3b8;font-size:13px}
label{display:block;font-size:13px;margin:12px 0 6px;color:#cbd5e1}
input{width:100%;padding:12px;background:#020617;border:1px solid #243244;border-radius:10px;color:#e2e8f0;font-size:15px}
button{margin-top:14px;width:100%;padding:12px;border-radius:10px;border:0;background:#22c55e;color:#052e16;font-weight:600;cursor:pointer}
button.secondary{margin-top:8px;background:#1e293b;color:#e2e8f0}
pre{margin-top:16px;background:#020617;border:1px solid #1e293b;border-radius:10px;padding:12px;max-height:240px;overflow:auto;font-size:12px;white-space:pre-wrap}
.status{margin-top:12px;font-size:12px;color:#94a3b8}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#334155;margin-right:6px}
.dot.ok{background:#22c55e}
.dot.err{background:#ef4444}
</style>
</head>
<body>
<div class="card">
  <h1>Admin Login • Supabase</h1>
  <p>Teste rápido com chave embutida</p>
  <label>Email</label>
  <input id="email" type="email" placeholder="seu@email.com">
  <label>Senha</label>
  <input id="senha" type="password" placeholder="••••••••">
  <button id="loginBtn">Entrar</button>
  <button id="testBtn" class="secondary">Testar conexão</button>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Pronto</span></div>
  <pre id="output">{"aguardando":true}</pre>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

const SUPABASE_URL = "https://lovwxccrxxahdxtychxy.supabase.co"
const SUPABASE_ANON_KEY = "sb_publishable_HJ3-sMYvcOXXWJTtkz-7Rg_alxdTn6L"

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

const $ = id => document.getElementById(id)
const email = $('email')
const senha = $('senha')
const output = $('output')
const statusText = $('statusText')
const dot = $('dot')

function show(obj, ok=null){
  output.textContent = JSON.stringify(obj, null, 2)
  dot.className = 'dot' + (ok===true?' ok': ok===false?' err':'')
  statusText.textContent = ok===true?'Sucesso': ok===false?'Erro':'Pronto'
}

$('loginBtn').onclick = async () => {
  statusText.textContent = 'Autenticando...'
  try{
    const {data,error} = await supabase.auth.signInWithPassword({
      email: email.value.trim(),
      password: senha.value
    })
    show({action:'login',data,error}, !error)
  }catch(e){ show({error:String(e)}, false) }
}

$('testBtn').onclick = async () => {
  statusText.textContent = 'Testando...'
  try{
    const {data,error} = await supabase.from('testimonials').select('id').limit(1)
    show({action:'select',data,error}, !error)
  }catch(e){ show({error:String(e)}, false) }
}
</script>
</body>
</html>
