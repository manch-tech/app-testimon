name: Manter Supabase Vivo
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar Supabase
        run: |
          curl -s "https://lovwxccrxxahdxtychxy.supabase.co/rest/v1/testimonials?select=id&limit=1" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" -o /dev/null
