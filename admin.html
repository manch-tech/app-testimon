<!DOCTYPE html>
<html lang="pt-BR">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin • Debug Login</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
:root {
  --bg: #050507;
  --bg2: #09090b;
  --card: #111113;
  --card-2: #18181b;
  --border: #23232a;
  --text: #e4e4e7;
  --muted: #8a8a93;
  --primary: #6366f1;
  --primary-2: #818cf8;
  --red: #ef4444;
  --amber: #f59e0b;
  --green: #22c55e;
  --ring: rgba(99,102,241,0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed; inset: 0;
  background: radial-gradient(800px 400px at 50% -100px, rgba(99,102,241,0.15), transparent 60%),
              radial-gradient(600px 300px at 80% 120%, rgba(168,85,247,0.1), transparent 50%),
              linear-gradient(180deg, var(--bg2), var(--bg));
  z-index: -2;
}
body::after {
  content: "";
  position: fixed; inset: 0;
  background-image: linear-gradient(transparent 0%, transparent calc(100% - 1px), rgba(255,255,255,0.02) 100%),
                    linear-gradient(90deg, transparent 0%, transparent calc(100% - 1px), rgba(255,255,255,0.02) 100%);
  background-size: 32px 32px;
  z-index: -1;
  opacity: .5;
}
.wrap {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px 48px;
  gap: 20px;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600;
  margin-bottom: 4px;
}
.brand svg { width: 18px; height: 18px; color: var(--primary-2); }
.card {
  width: 100%; max-width: 420px;
  background: linear-gradient(180deg, var(--card), var(--card-2));
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px;
  box-shadow: 0 20px 60px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.02) inset;
  backdrop-filter: blur(12px);
}
.card h1 {
  font-size: 22px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 4px;
}
.subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
form { display: flex; flex-direction: column; gap: 16px; }
label { display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 500; color: #c9c9d1; }
.input-wrap {
  position: relative; display: flex; align-items: center;
  background: #0a0a0f; border: 1px solid var(--border); border-radius: 12px;
  transition: border .15s, box-shadow .15s, background .15s;
}
.input-wrap:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--ring);
  background: #0c0c12;
}
.input-wrap input {
  width: 100%; background: transparent; border: 0; outline: 0;
  padding: 12px 14px; color: var(--text); font-size: 14px; font-family: inherit;
}
.input-wrap input::placeholder { color: #5a5a66; }
.icon-btn {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  background: transparent; border: 0; color: #6b6b78; cursor: pointer;
  width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px;
  transition: color .15s, background .15s;
}
.icon-btn:hover { color: var(--text); background: rgba(255,255,255,.04); }
.icon-btn svg { width: 18px; height: 18px; }
.btn-primary {
  margin-top: 4px;
  width: 100%; padding: 12px 16px; border-radius: 12px; border: 0;
  background: linear-gradient(180deg, var(--primary), #5458e6);
  color: white; font-weight: 500; font-size: 14px; cursor: pointer;
  transition: transform .08s, filter .15s, box-shadow .15s;
  box-shadow: 0 8px 20px -8px rgba(99,102,241,.6), 0 0 0 1px rgba(255,255,255,.08) inset;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary:hover { filter: brightness(1.05); }
.btn-primary:active { transform: translateY(1px); }
.btn-primary:disabled { opacity: .6; cursor: not-allowed; }
.btn-ghost {
  padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border);
  background: #0c0c10; color: var(--text); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: background .15s, border .15s;
}
.btn-ghost:hover { background: #141418; border-color: #2a2a33; }
.actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #1c1c22; }
.info-card, .debug-card {
  width: 100%; max-width: 420px;
  background: rgba(17,17,19,.7); border: 1px solid var(--border);
  border-radius: 16px; padding: 16px 18px; backdrop-filter: blur(8px);
}
.info-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; padding: 8px 0; }
.info-row + .info-row { border-top: 1px dashed #1e1e24; }
.info-row span:first-child { color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
.info-row code {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #c7d2fe;
  background: #0a0a0f; padding: 4px 8px; border-radius: 6px; border: 1px solid #1f1f27;
  max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.badge {
  font-size: 11px; padding: 4px 8px; border-radius: 999px; font-weight: 500;
  background: #1a1a21; color: var(--muted); border: 1px solid #25252e;
}
.badge.ok { background: rgba(34,197,94,.12); color: #86efac; border-color: rgba(34,197,94,.25); }
.badge.err { background: rgba(239,68,68,.12); color: #fca5a5; border-color: rgba(239,68,68,.25); }
.badge.wait { background: rgba(245,158,11,.12); color: #fcd34d; border-color: rgba(245,158,11,.25); }
.debug-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.debug-head h2 { font-size: 13px; font-weight: 600; color: #d4d4d8; letter-spacing: .02em; }
.debug-head button { font-size: 11px; }
pre#output {
  font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.6;
  background: #050507; color: #d4d4d8; border: 1px solid #1a1a1f; border-radius: 10px;
  padding: 12px; max-height: 280px; overflow: auto; white-space: pre-wrap; word-break: break-word;
}
.spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 480px) {
  .card { padding: 22px; border-radius: 18px; }
  .info-card, .debug-card { padding: 14px; }
  .info-row { flex-direction: column; align-items: flex-start; gap: 4px; }
  .info-row code { max-width: 100%; width: 100%; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    ADMIN DEBUG
  </div>

  <div class="card">
    <h1>Login de Depuração</h1>
    <p class="subtitle">Teste a autenticação do Supabase em ambiente isolado</p>
    
    <form id="login-form" autocomplete="on">
      <label>
        Email
        <div class="input-wrap">
          <input type="email" id="email" placeholder="admin@exemplo.com" required autocomplete="email" inputmode="email">
        </div>
      </label>
      <label>
        Senha
        <div class="input-wrap">
          <input type="password" id="password" placeholder="••••••••••••" required autocomplete="current-password">
          <button type="button" class="icon-btn" id="toggle-pass" aria-label="Mostrar senha">
            <svg id="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </label>
      <button type="submit" class="btn-primary" id="btn-login">
        <span>Entrar</span>
      </button>
    </form>

    <div class="actions">
      <button class="btn-ghost" id="btn-test">Testar conexão</button>
      <button class="btn-ghost" id="btn-logout">Logout</button>
    </div>
  </div>

  <div class="info-card">
    <div class="info-row">
      <span>Supabase URL</span>
      <code id="supabase-url">carregando...</code>
    </div>
    <div class="info-row">
      <span>Anon Key</span>
      <code id="supabase-key">carregando...</code>
    </div>
    <div class="info-row">
      <span>Status</span>
      <span id="status" class="badge wait">Inicializando</span>
    </div>
  </div>

  <div class="debug-card">
    <div class="debug-head">
      <h2>Saída de Debug</h2>
      <button class="btn-ghost" id="clear">Limpar</button>
    </div>
    <pre id="output">Aguardando ação...</pre>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const $ = (id) => document.getElementById(id);
  const output = $('output');
  const statusEl = $('status');
  const urlEl = $('supabase-url');
  const keyEl = $('supabase-key');
  const btnLogin = $('btn-login');
  const btnTest = $('btn-test');
  const btnLogout = $('btn-logout');
  const form = $('login-form');
  const togglePass = $('toggle-pass');
  const emailIn = $('email');
  const passIn = $('password');

  let sb = null;

  const log = (obj) => {
    output.textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
  };
  const setStatus = (text, type) => {
    statusEl.textContent = text;
    statusEl.className = 'badge ' + (type === 'ok' ? 'ok' : type === 'err' ? 'err' : 'wait');
  };
  const mask = (s) => s ? s.slice(0,4) + '...' + s.slice(-4) : '—';

  // init supabase
  try {
    const SUPABASE_URL = window.CONFIG?.SUPABASE_URL || window.SUPABASE_URL || '';
    const SUPABASE_ANON_KEY = window.CONFIG?.SUPABASE_ANON_KEY || window.SUPABASE_ANON_KEY || '';
    
    urlEl.textContent = SUPABASE_URL || 'não definido em config.js';
    keyEl.textContent = SUPABASE_ANON_KEY ? mask(SUPABASE_ANON_KEY) : 'não definido';
    urlEl.title = SUPABASE_URL;
    keyEl.title = SUPABASE_ANON_KEY;

    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
      throw new Error('config.js ausente ou inválido. Defina SUPABASE_URL e SUPABASE_ANON_KEY.');
    }
    if (!window.supabase) throw new Error('supabase-js não carregou');

    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });
    window.sb = sb;
    setStatus('Pronto', 'ok');
    log({ info: 'Supabase inicializado', url: SUPABASE_URL, key_prefix: SUPABASE_ANON_KEY.slice(0,8) });
  } catch (e) {
    setStatus('Erro config', 'err');
    log({ error: 'Falha ao inicializar', message: e.message });
    return;
  }

  // toggle password
  const eye = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const eyeOff = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  togglePass.addEventListener('click', () => {
    const isPass = passIn.type === 'password';
    passIn.type = isPass ? 'text' : 'password';
    togglePass.innerHTML = isPass ? eyeOff : eye;
    togglePass.setAttribute('aria-label', isPass ? 'Ocultar senha' : 'Mostrar senha');
  });

  // login
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = emailIn.value.trim();
    const password = passIn.value;
    if (!email || !password) return;

    btnLogin.disabled = true;
    btnLogin.innerHTML = '<div class="spinner"></div><span>Autenticando...</span>';
    setStatus('Autenticando...', 'wait');

    const start = Date.now();
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      const result = {
        timestamp: new Date().toISOString(),
        acao: 'signInWithPassword',
        duracao_ms: Date.now() - start,
        email,
        data,
        error: error ? {
          message: error.message,
          status: error.status,
          name: error.name,
          code: error.code || null,
          __full: error
        } : null
      };
      log(result);
      if (error) {
        setStatus(`Erro ${error.status || ''}`, 'err');
      } else {
        setStatus('Autenticado', 'ok');
      }
    } catch (err) {
      log({ timestamp: new Date().toISOString(), acao: 'signInWithPassword', exception: err.message, stack: err.stack });
      setStatus('Exceção', 'err');
    } finally {
      btnLogin.disabled = false;
      btnLogin.innerHTML = '<span>Entrar</span>';
    }
  });

  // testar conexão
  btnTest.addEventListener('click', async () => {
    setStatus('Testando...', 'wait');
    btnTest.disabled = true;
    try {
      const { data, error } = await sb.auth.getSession();
      const { data: userData } = await sb.auth.getUser();
      log({
        timestamp: new Date().toISOString(),
        acao: 'getSession',
        session: data.session,
        user: userData?.user || null,
        error: error ? { message: error.message, status: error.status } : null
      });
      setStatus(data.session ? 'Sessão ativa' : 'Sem sessão', data.session ? 'ok' : 'wait');
    } catch (e) {
      log({ acao: 'getSession', exception: e.message });
      setStatus('Erro', 'err');
    } finally {
      btnTest.disabled = false;
    }
  });

  // logout
  btnLogout.addEventListener('click', async () => {
    await sb.auth.signOut();
    log({ timestamp: new Date().toISOString(), acao: 'signOut', resultado: 'Sessão encerrada' });
    setStatus('Logout', 'wait');
  });

  $('clear').addEventListener('click', () => log('Aguardando ação...'));
});
</script>
<script>(function(){document.addEventListener("click",function(e){var a=e.target.closest("[data-product-id]");if(!a)return;e.preventDefault();var pid=a.getAttribute("data-product-id");if(pid)parent.postMessage({type:"ecto-artifact-link-click",productId:pid},"*")})})();</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;var a=target.closest?target.closest("a[href]"):null;if(!a||!a.href||!/^https?:\/\//.test(a.href))return;if(a.href.replace(/#.*$/,"")===loc)return;var productId=extractProductId(target)||extractProductId(a);if(!productId)return;e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*")},true)})();</script></body>
</html>
